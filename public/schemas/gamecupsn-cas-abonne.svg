<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 20 1220 1080" width="1220" height="1080"><rect x="70" y="20" width="1220" height="1080" fill="#fbfcfd"/><line x1="130.0" y1="608.0" x2="448.2" y2="335.5" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="455.9" y2="248.1" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="461.0" y2="160.4" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="674.4" y2="647.3" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="993.1" y2="494.7" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="743.9" y2="246.1" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="982.1" y2="650.0" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="1036.4" y2="243.6" stroke="#1F2933"/><line x1="499.4" y1="799.2" x2="780.6" y2="160.8" stroke="#1F6FB2" stroke-dasharray="6 4"/><path d="M773.0 167.3 L780.6 160.8 L780.9 170.8" fill="none" stroke="#1F6FB2"/><line x1="110.0" y1="568.0" x2="110.0" y2="388.0" stroke="#1F2933"/><path d="M104.2 398.5 L110.0 388.0 L115.8 398.5 Z" fill="#fff" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="435.2" y2="422.3" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="411.2" y2="506.6" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="373.7" y2="641.0" stroke="#1F2933"/><line x1="130.0" y1="608.0" x2="436.8" y2="801.6" stroke="#1F2933"/><line x1="485.0" y1="513.0" x2="485.0" y2="535.0" stroke="#1F6FB2" stroke-dasharray="6 4"/><path d="M489.3 526.0 L485.0 535.0 L480.7 526.0" fill="none" stroke="#1F6FB2"/><line x1="709.9" y1="719.8" x2="570.1" y2="680.2" stroke="#B24C1F" stroke-dasharray="6 4"/><path d="M577.6 686.8 L570.1 680.2 L580.0 678.4" fill="none" stroke="#B24C1F"/><rect x="320" y="40" width="950" height="852" fill="none" stroke="#1F2933" stroke-width="2"/><text x="795" y="63" text-anchor="middle" font-size="13" fill="#1F2933" font-weight="bold" font-family="Helvetica, Arial, sans-serif">GamecupSN — Cas d'utilisation : Abonné</text><ellipse cx="485" cy="128" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="131.8" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A1 — Créer un compte</text><ellipse cx="485" cy="216" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="213.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A2 — Se connecter et se</text><text x="485" y="226.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">déconnecter</text><ellipse cx="485" cy="304" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="301.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A3 — Modifier ses informations</text><text x="485" y="314.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">personnelles</text><ellipse cx="485" cy="392" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="395.9" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A4 — Personnaliser son profil</text><ellipse cx="485" cy="480" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="477.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A5 — Ajouter un identifiant en</text><text x="485" y="490.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">jeu</text><ellipse cx="485" cy="568" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="565.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A6 — Modifier ou supprimer un</text><text x="485" y="578.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">profil de jeu</text><ellipse cx="485" cy="656" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="653.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A7 — Consulter son tableau de</text><text x="485" y="666.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">bord</text><ellipse cx="485" cy="744" rx="125" ry="33" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="6 4"/><text x="485" y="741.0" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">A8 — Réinitialiser son mot de</text><text x="485" y="754.7" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">passe</text><ellipse cx="485" cy="832" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="829.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T1 — Créer une équipe et en</text><text x="485" y="842.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">devenir capitaine</text><ellipse cx="795" cy="128" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="125.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T2 — Récupérer le code</text><text x="795" y="138.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">d'invitation</text><ellipse cx="795" cy="216" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="213.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T3 — Rejoindre une équipe par</text><text x="795" y="226.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">son code</text><ellipse cx="795" cy="304" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="301.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T5 — Régénérer le code</text><text x="795" y="314.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">d'invitation</text><ellipse cx="795" cy="392" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="389.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T6 — Retirer un membre de</text><text x="795" y="402.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">l'équipe</text><ellipse cx="795" cy="480" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="477.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T7 — Personnaliser la page de</text><text x="795" y="490.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">l'équipe</text><ellipse cx="795" cy="568" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="565.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T8 — Consulter la composition de</text><text x="795" y="578.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">son équipe</text><ellipse cx="795" cy="656" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="659.9" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T9 — Quitter son équipe</text><ellipse cx="795" cy="744" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="741.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T10 — Voir les arrivées depuis</text><text x="795" y="754.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">la dernière visite</text><ellipse cx="795" cy="832" rx="125" ry="33" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="6 4"/><text x="795" y="835.9" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">T11 — Transmettre le capitanat</text><ellipse cx="1105" cy="128" rx="125" ry="33" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="6 4"/><text x="1105" y="131.8" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">T12 — Se déclarer joueur libre</text><ellipse cx="1105" cy="216" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="213.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">N2 — Consulter ses notifications</text><text x="1105" y="226.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">regroupées</text><ellipse cx="1105" cy="304" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="301.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">N9 — Marquer ses notifications</text><text x="1105" y="314.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">comme lues</text><ellipse cx="1105" cy="392" rx="125" ry="33" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="6 4"/><text x="1105" y="389.0" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">N10 — Choisir les notifications</text><text x="1105" y="402.7" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">reçues</text><ellipse cx="1105" cy="480" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="483.9" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">H1 — Consulter son historique</text><ellipse cx="1105" cy="568" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="571.9" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">H2 — Consulter son palmarès</text><ellipse cx="1105" cy="656" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="653.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">S1 — Signaler un utilisateur,</text><text x="1105" y="666.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">une équipe ou un match</text><ellipse cx="1105" cy="744" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="741.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">S2 — Suivre l'état de son</text><text x="1105" y="754.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">signalement</text><ellipse cx="1105" cy="832" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="1105" y="829.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">H5 — Voir avec quelle équipe</text><text x="1105" y="842.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">chaque tournoi a été joué</text><circle cx="110" cy="293.6" r="9.6" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/><path d="M110 303.2 V333.6 M90 314.4 H130 M110 333.6 L90 364 M110 333.6 L130 364" stroke="#1F2933" stroke-width="2" fill="none"/><text x="110" y="384.6" text-anchor="middle" font-size="13" fill="#1F2933" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Visiteur</text><circle cx="110" cy="577.6" r="9.6" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/><path d="M110 587.2 V617.6 M90 598.4 H130 M110 617.6 L90 648 M110 617.6 L130 648" stroke="#1F2933" stroke-width="2" fill="none"/><text x="110" y="668.5" text-anchor="middle" font-size="13" fill="#1F2933" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Abonné</text><path d="M320 922 H1254 L1270 938 V1080 H320 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1254 922 V938 H1270" fill="none" stroke="#C8A415"/><text x="328" y="941" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">L'abonné hérite de tous les cas du visiteur (généralisation).</text><text x="328" y="955.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">A5 porte le multi-jeux : l'identifiant en jeu appartient au couple (compte, jeu),</text><text x="328" y="969.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">jamais au compte seul.</text><text x="328" y="983.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">T10 étend le tableau de bord : le regroupement se calcule depuis la dernière connexion,</text><text x="328" y="998.2" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">il n'y a pas une notification par arrivée (décision 13).</text><text x="328" y="1012.5" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">CONTRAINTE T4 : un abonné ne peut appartenir qu'à une seule équipe par jeu.</text><text x="328" y="1026.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Ce n'est pas un cas d'utilisation mais une règle métier, garantie par une</text><text x="328" y="1041.1" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">contrainte d'unicité en base (décision 10).</text><rect x="611.3" y="470.0" width="57.5" height="16" fill="#fbfcfd"/><text x="640.0" y="483.5" text-anchor="middle" font-size="10" fill="#1F6FB2" font-family="Helvetica, Arial, sans-serif">«include»</text><rect x="459.0" y="514.0" width="52.0" height="16" fill="#fbfcfd"/><text x="485.0" y="527.5" text-anchor="middle" font-size="10" fill="#1F6FB2" font-family="Helvetica, Arial, sans-serif">«extend»</text><rect x="614.0" y="690.0" width="52.0" height="16" fill="#fbfcfd"/><text x="640.0" y="703.5" text-anchor="middle" font-size="10" fill="#B24C1F" font-family="Helvetica, Arial, sans-serif">«extend»</text></svg>
