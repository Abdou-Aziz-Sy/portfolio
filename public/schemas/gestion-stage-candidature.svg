<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
<!-- Dépôt d'une candidature dans Gestion_Stage, relevé dans le code du projet :
     backend/routes/candidateRoutes.js (upload.fields cv + coverLetter), backend/controllers/candidateController.js
     (multer.diskStorage vers ../uploads/, nom `${Date.now()}-${originalname}`, chemins req.files[…].path, statut
     « En attente », suppression par findByIdAndDelete sans effacer les fichiers), backend/models/candidateModel.js. -->
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1F2933"/></marker></defs>
<rect width="1000" height="540" fill="#fbfcfd"/>
<text x="500" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">Gestion de stages — dépôt d'une candidature</text>

<!-- Flux -->
<path d="M190 100 H360" fill="none" stroke="#1F2933" stroke-width="1.4" marker-end="url(#pointe)"/>
<text x="275" y="88" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Consolas, monospace">POST /api/candidates</text>
<text x="275" y="120" text-anchor="middle" font-size="11" fill="#52606D" font-family="Consolas, monospace">multipart/form-data</text>
<path d="M560 100 H700" fill="none" stroke="#1F2933" stroke-width="1.4" marker-end="url(#pointe)"/>
<text x="630" y="88" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Consolas, monospace">req.files[…].path</text>
<path d="M460 130 V260" fill="none" stroke="#1F2933" stroke-width="1.4" marker-end="url(#pointe)"/>
<text x="472" y="200" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">écrit le CV et la lettre</text>
<path d="M835 130 V220" fill="none" stroke="#1F2933" stroke-width="1.4" marker-end="url(#pointe)"/>
<text x="847" y="180" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">crée le document</text>
<path d="M700 330 H560" fill="none" stroke="#B24C1F" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="630" y="318" text-anchor="middle" font-size="12" fill="#B24C1F" font-family="Helvetica, Arial, sans-serif">seul lien :</text>
<text x="630" y="350" text-anchor="middle" font-size="12" fill="#B24C1F" font-family="Helvetica, Arial, sans-serif">un chemin</text>

<!-- Navigateur -->
<rect x="30" y="70" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.5"/>
<text x="110" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">Navigateur</text>
<text x="110" y="115" text-anchor="middle" font-size="11" fill="#52606D" font-family="Helvetica, Arial, sans-serif">formulaire de candidature</text>

<!-- Multer -->
<rect x="360" y="70" width="200" height="60" rx="10" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1.5"/>
<text x="460" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">Multer</text>
<text x="460" y="115" text-anchor="middle" font-size="11" fill="#52606D" font-family="Consolas, monospace">diskStorage · cv + coverLetter</text>

<!-- Contrôleur -->
<rect x="700" y="70" width="270" height="60" rx="10" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1.5"/>
<text x="835" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">candidateController</text>
<text x="835" y="115" text-anchor="middle" font-size="11" fill="#52606D" font-family="Consolas, monospace">createCandidate</text>

<!-- Disque -->
<rect x="360" y="260" width="200" height="120" rx="10" fill="#F5F5F5" stroke="#616E7C" stroke-width="1.5"/>
<text x="460" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">Disque du serveur</text>
<text x="460" y="314" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Consolas, monospace">backend/uploads/</text>
<text x="460" y="340" text-anchor="middle" font-size="11" fill="#52606D" font-family="Consolas, monospace">&lt;horodatage&gt;-&lt;nom d'origine&gt;</text>
<text x="460" y="360" text-anchor="middle" font-size="11" fill="#52606D" font-family="Helvetica, Arial, sans-serif">CV et lettre de motivation</text>

<!-- MongoDB -->
<rect x="700" y="220" width="270" height="190" rx="10" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1.5"/>
<rect x="700" y="220" width="270" height="34" rx="10" fill="#D4E4F7" stroke="#1F6FB2" stroke-width="1.5"/>
<text x="835" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#10202F" font-family="Helvetica, Arial, sans-serif">MongoDB · Candidate</text>
<g font-size="11.5" fill="#1F2933" font-family="Consolas, monospace">
<text x="714" y="276">firstName, lastName, email (unique)</text>
<text x="714" y="298">stage → Stage (référence)</text>
<text x="714" y="320">status : En attente | Accepté</text>
<text x="778" y="338">| Rejeté · défaut En attente</text>
<text x="714" y="362">cv : chemin du fichier</text>
<text x="714" y="384">coverLetter : chemin du fichier</text>
</g>

<!-- Suite du cycle -->
<rect x="30" y="440" width="940" height="82" rx="6" fill="#FFF8E1" stroke="#C8A415"/>
<g font-size="12.5" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">
<text x="46" y="464">Ensuite : PUT /api/candidates/:id/status fait évoluer le statut ; GET /api/candidates/download/cv/:id relit le fichier</text>
<text x="46" y="484">dans uploads/ à partir du chemin enregistré ; DELETE /api/candidates/:id supprime le document, mais laisse ses fichiers</text>
<text x="46" y="504">sur le disque. Rien ne réconcilie la base et le disque.</text>
</g>
</svg>
