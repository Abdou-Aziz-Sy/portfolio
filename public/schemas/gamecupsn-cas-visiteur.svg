rial, sans-serif">tournoi</text><ellipse cx="485" cy="304" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="301.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V3 — Consulter un bracket et les</text><text x="485" y="314.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">équipes inscrites</text><ellipse cx="485" cy="392" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="389.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V4 — Consulter le profil public</text><text x="485" y="402.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">d'un joueur</text><ellipse cx="485" cy="480" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="477.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V5 — Consulter la page publique</text><text x="485" y="490.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">d'une équipe</text><ellipse cx="485" cy="568" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="485" y="565.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V6 — Consulter les picks et bans</text><text x="485" y="578.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">d'un match joué</text><ellipse cx="795" cy="128" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="125.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V7 — Créer un compte pour</text><text x="795" y="138.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">s'inscrire</text><ellipse cx="795" cy="216" rx="125" ry="33" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="6 4"/><text x="795" y="213.0" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">V8 — Filtrer les tournois par</text><text x="795" y="226.7" text-anchor="middle" font-size="11" fill="#616E7C" font-family="Helvetica, Arial, sans-serif">statut, jeu et date</text><ellipse cx="805" cy="311" rx="135" ry="40" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="805" y="308.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">K7 — Consulter l'historique des</text><text x="805" y="321.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">picks et bans d'un match</text><ellipse cx="800" cy="392" rx="130" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="800" y="389.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">H3 — Consulter l'historique et le</text><text x="800" y="402.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">palmarès d'un joueur</text><ellipse cx="795" cy="480" rx="125" ry="33" fill="#E8F1FB" stroke="#1F6FB2" stroke-width="1"/><text x="795" y="477.0" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">H4 — Consulter le palmarès d'une</text><text x="795" y="490.7" text-anchor="middle" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">équipe</text><circle cx="110" cy="303.6" r="9.6" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/><path d="M110 313.2 V343.6 M90 324.4 H130 M110 343.6 L90 374 M110 343.6 L130 374" stroke="#1F2933" stroke-width="2" fill="none"/><text x="110" y="394.6" text-anchor="middle" font-size="13" fill="#1F2933" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Visiteur</text><path d="M320 658 H944 L960 674 V748 H320 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M944 658 V674 H960" fill="none" stroke="#C8A415"/><text x="328" y="677" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Tout est consultable sans compte (décision 9 : rien n'est masquable).</text><text x="328" y="691.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">V7 étend la consultation : la demande de compte n'apparaît qu'au moment</text><text x="328" y="705.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">où le visiteur tente de s'inscrire.</text><text x="328" y="719.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">En pointillé gris : périmètre V2, non livré au MVP.</text><rect x="614.0" y="118.0" width="52.0" height="16" fill="#fbfcfd"/><text x="640.0" y="131.5" text-anchor="middle" font-size="10" fill="#B24C1F" font-family="Helvetica, Arial, sans-serif">«extend»</text></svg>
