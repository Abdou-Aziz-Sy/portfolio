-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PENDING</text><text x="1063" y="642.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">VETO</text><text x="1063" y="664.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">READY</text><text x="1063" y="686.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">FINISHED</text><text x="1063" y="708.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">FORFEIT</text><rect x="1057" y="726" width="215" height="88" fill="#fff" stroke="#B26B1F" stroke-width="1"/><rect x="1057" y="726" width="215" height="44" fill="#FFF4E5" stroke="#B26B1F" stroke-width="1"/><text x="1164.5" y="744.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">«enumeration»</text><text x="1164.5" y="759.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">VetoAction</text><text x="1063" y="784.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PICK</text><text x="1063" y="806.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">BAN</text><rect x="1057" y="824" width="215" height="132" fill="#fff" stroke="#B26B1F" stroke-width="1"/><rect x="1057" y="824" width="215" height="44" fill="#FFF4E5" stroke="#B26B1F" stroke-width="1"/><text x="1164.5" y="842.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">«enumeration»</text><text x="1164.5" y="857.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">ReportTargetType</text><text x="1063" y="882.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">USER</text><text x="1063" y="904.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TEAM</text><text x="1063" y="926.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TOURNAMENT</text><text x="1063" y="948.9" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">MATCH</text><rect x="1057" y="966" width="215" height="132" fill="#fff" stroke="#B26B1F" stroke-width="1"/><rect x="1057" y="966" width="215" height="44" fill="#FFF4E5" stroke="#B26B1F" stroke-width="1"/><text x="1164.5" y="984.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">«enumeration»</text><text x="1164.5" y="999.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">ReportStatus</text><text x="1063" y="1024.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">OPEN</text><text x="1063" y="1046.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">INVESTIGATING</text><text x="1063" y="1068.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">RESOLVED</text><text x="1063" y="1090.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">DISMISSED</text><rect x="1057" y="1108" width="215" height="286" fill="#fff" stroke="#B26B1F" stroke-width="1"/><rect x="1057" y="1108" width="215" height="44" fill="#FFF4E5" stroke="#B26B1F" stroke-width="1"/><text x="1164.5" y="1126.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">«enumeration»</text><text x="1164.5" y="1141.7" text-anchor="middle" font-size="12" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">NotificationType</text><text x="1063" y="1166.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TOURNAMENT_PUBLISHED</text><text x="1063" y="1188.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TOURNAMENT_CANCELLED</text><text x="1063" y="1210.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TOURNAMENT_UPDATED</text><text x="1063" y="1232.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TEAM_MEMBER_JOINED</text><text x="1063" y="1254.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PARTY_REGISTERED</text><text x="1063" y="1276.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PARTY_REMOVED</text><text x="1063" y="1298.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">ADDED_TO_ROSTER</text><text x="1063" y="1320.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">MATCH_READY</text><text x="1063" y="1342.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">VETO_YOUR_TURN</text><text x="1063" y="1364.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">MANAGER_GRANTED</text><text x="1063" y="1386.8" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">REPORT_RESOLVED</text><path d="M734.5 1404 H1578.5 L1594.5 1420 V1477 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1404 V1420 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1423" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PRINCIPE STRUCTURANT — l'identité ne connaît aucun jeu. (décision 2)</text><text x="742.5" y="1437.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">User ne porte aucune donnée de jeu : tout ce qui est propre à un jeu vit dans UserGameProfile, ou sur Game.</text><text x="742.5" y="1451.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Ajouter un jeu = une ligne dans Game, avec son trackerUrlTemplate et ses vetoRules. Aucune migration.</text><path d="M734.5 1487 H1578.5 L1594.5 1503 V1560 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1487 V1503 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1506" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Team = l'équipe permanente. TeamMember = l'appartenance d'un joueur à une Team.</text><text x="742.5" y="1520.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">TeamMember.gameId est DÉLIBÉRÉMENT dupliqué depuis Team : c'est le seul moyen d'imposer « une seule équipe</text><text x="742.5" y="1534.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">par joueur et par jeu » par la contrainte {U} (userId, gameId). (décision 10)</text><path d="M734.5 1570 H1578.5 L1594.5 1586 V1643 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1570 V1586 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1589" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Party = une équipe engagée dans UN tournoi. PartyPlayer = ses joueurs alignés. (décisions 11, 37, 46)</text><text x="742.5" y="1603.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Party.teamId est facultatif : vide = équipe temporaire, montée pour ce seul tournoi, nommée « Équipe N »</text><text x="742.5" y="1617.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">par défaut. Les joueurs d'une Party n'appartiennent pas forcément à sa Team.</text><path d="M734.5 1653 H1578.5 L1594.5 1669 V1726 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1653 V1669 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1672" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Un joueur, une seule composition par tournoi. (décision 47)</text><text x="742.5" y="1686.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">PartyPlayer.tournamentId est dupliqué depuis Party pour poser {U} (tournamentId, userId) : même principe</text><text x="742.5" y="1700.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">que TeamMember.gameId. Sans elle, un joueur pourrait s'aligner dans deux équipes du même tournoi.</text><path d="M734.5 1736 H1578.5 L1594.5 1752 V1809 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1736 V1752 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1755" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Match pointe vers Party, jamais vers Team : ce qui s'affronte est une participation à CE tournoi.</text><text x="742.5" y="1769.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">finalMap est conservé — une carte peut exister sans veto. Le veto est optionnel (Tournament.vetoEnabled) ;</text><text x="742.5" y="1783.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">ses RÈGLES sont un JSON (vetoRules), son DÉROULÉ une ligne MatchVeto par action. (décisions 41 à 43)</text><path d="M734.5 1819 H1578.5 L1594.5 1835 V1892 H734.5 Z" fill="#FFF8E1" stroke="#C8A415"/><path d="M1578.5 1819 V1835 H1594.5" fill="none" stroke="#C8A415"/><text x="742.5" y="1838" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Aucune valeur dérivée n'est stockée. (décision 44)</text><text x="742.5" y="1852.3" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">Pas de compteur de membres, pas de table de palmarès : ils se calculent depuis TeamMember, Match, Party</text><text x="742.5" y="1866.6" font-size="11" fill="#1F2933" font-family="Helvetica, Arial, sans-serif">et PartyPlayer. Un compteur stocké finit toujours par diverger de la réalité.</text></svg>
